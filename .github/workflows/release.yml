# Publica una versión: actualizá __version__ en src/rushes/__init__.py, commiteá y
#   git tag v0.2.0 && git push origin v0.2.0
# Este workflow corre los tests en Windows, arma el instalador y crea la Release
# con Rushes-Setup-<versión>.exe + .sha256 (la app los usa para actualizarse).
name: Release

on:
  push:
    tags: ["v*.*.*"]

# Solo lo necesario para crear la Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verificar que el tag coincide con __version__
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = (Select-String -Path src\rushes\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG != __version__ $v" }

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Bajar rclone y ffprobe (verificando SHA256)
        shell: pwsh
        run: |
          if (Test-Path vendor\checksums.txt) { .\scripts\fetch_vendor.ps1 }
          else {
            Write-Warning "No hay vendor/checksums.txt: se verifican solo contra el checksum oficial. Corré fetch_vendor.ps1 -UpdatePins y commitealo."
            .\scripts\fetch_vendor.ps1 -UpdatePins
          }

      - name: Tests + PyInstaller + instalador
        shell: pwsh
        run: .\scripts\build.ps1

      - name: SHA256 del instalador
        shell: pwsh
        run: |
          $exe = Get-ChildItem packaging\Output\Rushes-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii "$($exe.FullName).sha256"
          Write-Host "$($exe.Name) $hash"

      # gh viene instalado en los runners de GitHub: sin Actions de terceros en el camino del instalador.
      - name: Publicar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $files = Get-ChildItem packaging\Output\Rushes-Setup-* | ForEach-Object FullName
          gh release create $env:TAG @files --title "Rushes $env:TAG" --generate-notes
